name: Fix Google Sheets two-way sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Google Sheets pull token handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/tabs/GoogleSheetsTab.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'let activeToken = token || getAccessToken();'
          new = 'let activeToken = token || getAccessToken() || cloudToken;'

          count = text.count(old)
          if count:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'Patched {count} Google Sheets pull handlers to use the cloud-synced Google token.')
          else:
              print('No old pull-token pattern found; patch may already be applied.')

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/tabs/GoogleSheetsTab.tsx
          git commit -m "Fix Google Sheets pull to use shared cloud authorization"
          git push
